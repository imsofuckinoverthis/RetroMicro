<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#245e9b">
<title>RetroMicro — Your personal Micro Retro desktop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,Verdana,sans-serif}button,input{font:inherit}button{cursor:pointer}
#app{height:100%;width:100%;background:#071b34}.screen{height:100%;width:100%;position:relative;overflow:hidden}
.titlebar{height:30px;background:linear-gradient(#4b9cdb,#1761a0 55%,#14518a);color:#fff;padding:6px 11px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;text-shadow:1px 1px #17436b}
.panel{width:min(92%,610px);margin:7vh auto;background:#eceff2;border:1px solid #536d85;box-shadow:0 12px 35px #00152c88}.panelbody{padding:clamp(20px,4vw,34px)}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#3a6e97;font-weight:bold}.hero{font-size:clamp(27px,5vw,43px);line-height:1.12;margin:10px 0 14px;color:#174b83}.muted{color:#53687b;line-height:1.6}.welcome-mark{font-size:58px;margin:12px 0 4px;color:#2876b4;text-shadow:2px 3px #a8c6dd}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}.btn{border:1px solid #174d7d;background:linear-gradient(#65b1e8,#2872b3 55%,#1b5b96);color:white;padding:11px 22px;border-radius:4px;box-shadow:inset 0 1px #ffffff88,0 2px 2px #0002;text-shadow:0 1px #17436b}.secondary{background:linear-gradient(#fff,#dce4eb);color:#24415d;border-color:#8da4b8;text-shadow:none}
.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:13px;font-weight:bold}.field input{padding:12px;border:1px solid #8ea6ba;background:#fff;box-shadow:inset 1px 1px 3px #0002;width:100%;border-radius:2px}.hint{font-size:11px;color:#687c8e;line-height:1.5}
.wallpapers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.wall{border:2px solid #a5b5c2;padding:7px;background:#f8fafb;text-align:left;color:#20384f;border-radius:3px}.wall.selected{border:3px solid #1976b9;padding:6px;box-shadow:0 0 0 2px #a8d7f4}.swatch{height:115px;margin-bottom:9px;border:1px solid #8198a9}.beach{background:linear-gradient(#72c5f4 0 46%,#ffe2a2 47% 55%,#e8c47e 56% 68%,#168db8 69% 100%)}.guitar{background:radial-gradient(ellipse at 50% 63%,#e5a84f 0 13%,transparent 14%),linear-gradient(90deg,transparent 47%,#d8b77b 48% 52%,transparent 53%),linear-gradient(135deg,#292231,#8b563b 48%,#171a28)}.pipes{background-color:#17243a;background-image:linear-gradient(90deg,transparent 45%,#42d9cb 46% 53%,transparent 54%),linear-gradient(0deg,transparent 45%,#f6c84a 46% 53%,transparent 54%),linear-gradient(90deg,transparent 18%,#d45cff 19% 25%,transparent 26%),linear-gradient(0deg,transparent 76%,#76d65e 77% 83%,transparent 84%);background-size:42px 42px,42px 42px,64px 64px,64px 64px}
.boot{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,#2869a4,#071a34);color:white}.boot h1{font-size:clamp(34px,7vw,62px);letter-spacing:3px;margin:12px 0}.boot p{color:#c8e5fb}.bootline{width:min(310px,70vw);height:13px;border:1px solid #8fc9ee;margin:25px auto 12px;padding:2px;background:#0b2541}.bootline span{display:block;height:100%;width:0;background:linear-gradient(90deg,#65c4ee,#d5f6ff);animation:load 7s linear forwards}@keyframes load{to{width:100%}}
/* The desktop is a desktop: wallpaper fills the whole screen, icons sit on it, and the taskbar stays at the bottom. */
#desktop{height:100%;width:100%;position:relative;overflow:hidden;background:#1479b5}
.wallpaper{position:absolute;inset:0;overflow:hidden}
.wallpaper.beach{background:linear-gradient(#50b6ed 0%,#a6dcf5 43%,#f8dca0 44%,#e7c47f 56%,#178eb7 57%,#08749f 100%)}
.wallpaper.beach:before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:#fff1b4;right:13%;top:12%;box-shadow:0 0 55px 20px #fff0a0aa}
.wallpaper.beach:after{content:"";position:absolute;left:-5%;right:-5%;height:28%;bottom:12%;background:linear-gradient(170deg,transparent 0 28%,#fff8 29% 31%,transparent 32% 55%,#d8f4ef88 56% 58%,transparent 59%),linear-gradient(#1ba0c1,#08769f);clip-path:polygon(0 15%,100% 0,100% 100%,0 100%)}
.wallpaper.guitar{background:radial-gradient(ellipse at 50% 60%,#a66c46,#342b36 48%,#171b2b 100%)}
.wallpaper.guitar:before{content:"";position:absolute;width:clamp(170px,28vw,330px);height:clamp(250px,55vh,470px);left:50%;top:48%;transform:translate(-50%,-50%) rotate(-18deg);background:radial-gradient(ellipse at 50% 70%,#f1b65c 0 24%,#a35e2f 25% 31%,transparent 32%),linear-gradient(90deg,transparent 44%,#e3c58b 45% 55%,transparent 56%);filter:drop-shadow(8px 12px 8px #0009);border-radius:50%}
.wallpaper.guitar:after{content:"";position:absolute;width:20px;height:58%;left:50%;top:4%;transform:rotate(-18deg);background:linear-gradient(90deg,#9b784c,#f2d9a0,#80603c);box-shadow:0 0 0 2px #241b19}
.wallpaper.pipes{background-color:#101b31;background-image:linear-gradient(90deg,transparent 46%,#31d7d0 47% 53%,transparent 54%),linear-gradient(0deg,transparent 46%,#ffc64e 47% 53%,transparent 54%),linear-gradient(90deg,transparent 18%,#d85cff 19% 24%,transparent 25%),linear-gradient(0deg,transparent 76%,#7cdb62 77% 82%,transparent 83%),linear-gradient(45deg,transparent 47%,#f56b7e 48% 52%,transparent 53%);background-size:86px 86px,86px 86px,128px 128px,128px 128px,172px 172px}
.desktop-icons{position:absolute;inset:10px auto 54px 9px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:8px;width:100%;pointer-events:none}
.desktop-icon{width:82px;min-height:82px;padding:5px 3px;border:1px solid transparent;background:transparent;color:#fff;text-shadow:1px 1px 2px #001a38,1px 1px 3px #001a38;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;line-height:1.15;text-align:center;pointer-events:auto}
.desktop-icon:hover,.desktop-icon:focus{background:#4a94d866;border:1px dotted #fff;outline:none}.desktop-icon .glyph{font-size:34px;line-height:38px;filter:drop-shadow(1px 2px 1px #00264b)}
.taskbar{position:absolute;z-index:20;bottom:0;left:0;right:0;height:42px;background:linear-gradient(#3c91d3 0%,#1765ad 12%,#12559a 85%,#0b4385 100%);border-top:1px solid #8cc6ef;box-shadow:0 -2px 6px #00264a55;display:flex;align-items:center;padding:3px 5px;gap:6px}
.start-button{height:34px;min-width:90px;border:1px solid #316b38;border-radius:0 12px 12px 0;background:linear-gradient(#83d56b,#319b36 55%,#16702a);color:#fff;font-weight:bold;font-style:italic;text-shadow:1px 1px #185624;box-shadow:inset 1px 1px #d5ffc3;display:flex;align-items:center;justify-content:center;gap:6px}
.start-orb{font-size:21px;font-style:normal}.task-open{height:29px;min-width:110px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:5px 12px;color:#fff;background:linear-gradient(#4b9cdb,#2464a3);border:1px solid #174c83;border-radius:3px;box-shadow:inset 1px 1px #ffffff55}
.tray{margin-left:auto;height:32px;padding:0 10px;border-left:1px solid #7ab7e3;display:flex;align-items:center;color:#fff;font-size:12px;white-space:nowrap}
.start-menu{display:none;position:absolute;z-index:30;bottom:41px;left:4px;width:min(340px,94vw);background:#e9f2fa;border:1px solid #174d80;box-shadow:3px 4px 12px #001b38aa}
.start-menu.show{display:block}.start-head{padding:13px;color:white;font-weight:bold;background:linear-gradient(110deg,#0d477e,#3b9ad9)}.start-links{padding:8px;display:grid;gap:3px}.start-links button{border:0;background:transparent;text-align:left;padding:10px;color:#183b5c}.start-links button:hover{background:#c6e4fa}
.window{position:absolute;z-index:10;top:12%;left:20%;width:min(520px,88vw);min-height:230px;background:#ece9d8;border:1px solid #164c82;box-shadow:3px 5px 16px #001a3b88}.window .titlebar{height:29px;cursor:move}.win-controls{display:flex;gap:3px}.win-controls button{width:21px;height:19px;padding:0;border:1px solid #fff;border-radius:3px;background:linear-gradient(#eaf5ff,#8ab5d9);color:#163b61;font-weight:bold;line-height:15px}.win-body{padding:19px;color:#263d50;font-size:13px;line-height:1.5}.window-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.window-actions button{padding:6px 16px;border:1px solid #8a9ba8;background:linear-gradient(#fff,#d9e0e5);border-radius:2px;color:#183b5c}
@media(max-width:600px){.panel{margin:4vh auto}.wallpapers{gap:7px}.swatch{height:82px}.wall{padding:5px}.wall strong{font-size:11px}.desktop-icons{gap:2px;inset:6px auto 50px 5px;width:100%;max-height:calc(100% - 55px)}.desktop-icon{width:72px;min-height:76px;font-size:11px}.desktop-icon .glyph{font-size:30px}.taskbar{height:42px}.start-button{min-width:78px}.tray{padding:0 6px;font-size:11px}.window{left:5%;top:13%;width:90%;max-height:72%;overflow:auto}}

/* RetroMicro vintage opening sequence */
.opening{height:100%;min-height:100%;position:relative;display:grid;place-items:center;overflow:hidden;background:#222}
.opening-bg{position:absolute;inset:-24px;background:radial-gradient(ellipse at 25% 30%,#f5b45b 0,transparent 35%),radial-gradient(ellipse at 72% 25%,#70c9d4 0,transparent 38%),radial-gradient(ellipse at 50% 80%,#9b75bc 0,transparent 42%),linear-gradient(135deg,#4b6c8e,#d7b58b 48%,#315c70);filter:blur(23px) saturate(1.25);transform:scale(1.12)}
.opening-shade{position:absolute;inset:0;background:#101a2a33}
.login-card{position:relative;z-index:1;width:min(90%,390px);text-align:center;color:#fff;text-shadow:0 1px 4px #25384b;padding:24px 20px}
.login-avatar{width:82px;height:82px;margin:0 auto 12px;border-radius:50%;background:#f1f3f6;color:#65717d;display:grid;place-items:center;font-size:46px;text-shadow:none;border:1px solid #ffffffaa}
.login-card h1{font-size:clamp(24px,5vw,32px);font-weight:400;line-height:1.25;margin:12px 0 8px}
.login-card p{font-size:14px;color:#f1f5f8;margin:0 auto 22px;max-width:300px}
.login-actions{display:grid;gap:10px;width:min(100%,270px);margin:0 auto}
.login-actions button{min-height:45px;border:1px solid #e6f0f8;background:linear-gradient(#f8fbff,#d5e4f0);color:#203a53;border-radius:3px;font-weight:bold;box-shadow:0 2px 8px #0003;text-shadow:none}
.login-actions button.primary{background:linear-gradient(#4b9bd2,#1764a0);color:#fff;border-color:#b7d9f0;text-shadow:0 1px #17436b}
.login-foot{position:absolute;z-index:1;bottom:20px;left:0;right:0;text-align:center;color:#e7edf4;font-size:11px;text-shadow:0 1px 3px #15263b}
.dial-screen{height:100%;display:grid;place-items:center;background:#4b3192;padding:18px}
.dial-window{width:min(92%,540px);background:#d6d6d6;border:3px solid #f1f1f1;box-shadow:4px 5px 0 #25204c}
.dial-title{height:38px;background:#1000a8;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font:bold 16px Tahoma,Verdana,sans-serif}
.dial-controls{display:flex;gap:5px}.dial-controls span{width:27px;height:25px;background:#ddd;color:#111;border:2px outset white;text-align:center;line-height:21px;font:bold 19px Arial}
.dial-body{min-height:260px;background:#159e98;display:flex;align-items:center;justify-content:space-evenly;gap:8px;padding:24px 12px;color:#fff}
.dial-computer{font-size:clamp(54px,12vw,94px);filter:drop-shadow(2px 4px 1px #17615d)}
.dial-modem{font-size:clamp(34px,8vw,62px)}
.dial-dots{font-size:30px;letter-spacing:4px;animation:blink .8s steps(2,end) infinite}
.dial-globe{font-size:clamp(56px,12vw,94px)}
.dial-caption{background:#d6d6d6;color:#222;padding:10px 13px;text-align:center;font-size:12px}
.dial-progress{height:12px;border:2px inset #aaa;background:#eee;margin-top:8px}.dial-progress span{display:block;height:100%;width:0;background:#1515b5;animation:dialload 5.4s linear forwards}
@keyframes dialload{to{width:100%}}@keyframes blink{50%{opacity:.2}}
.account-old{width:min(92%,470px);margin:auto;background:#e5e5e5;border:2px solid #fff;box-shadow:4px 5px 0 #0006;color:#202020}
.account-old .old-title{background:#1010a8;color:#fff;font-weight:bold;padding:10px 12px}
.account-old .old-content{padding:20px}
.account-old h2{font-size:22px;margin:0 0 8px;color:#172f58}
.account-old .old-tabs{display:flex;gap:5px;margin:16px 0}
.account-old .old-tabs button{flex:1;padding:9px 5px;border:2px outset #fff;background:#d8d8d8;color:#222}
.account-old .old-tabs button.active{background:#fff;border:2px inset #aaa;font-weight:bold}
.account-old .field input{border:2px inset #aaa;border-radius:0;padding:10px}
.account-old .btn{border-radius:0}

</style>
</head>
<body><div id="app"><main class="screen" id="screen" aria-live="polite"></main></div>
<script>
const screen=document.getElementById('screen');
const state={username:'',wallpaper:'beach'};
const choices=[{id:'beach',name:'Sunny Beach',desc:'A little seaside escape'},{id:'guitar',name:'Electric Guitar',desc:'Turn up the volume'},{id:'pipes',name:'Color Pipes',desc:'Classic computer colors'}];
function topbar(step){return '<div class="titlebar"><span>▣ RETROMICRO</span><small>'+step+'</small></div>'}
function welcome(){screen.innerHTML='<section class="opening"><div class="opening-bg"></div><div class="opening-shade"></div><div class="login-card"><div class="login-avatar">⌂</div><h1>Welcome to your RetroMicro desktop.</h1><p>Your own little computer world is ready.</p><div class="login-actions"><button class="primary" id="begin">Sign Up</button><button id="returning">Log In</button></div></div><div class="login-foot">RETROMICRO PERSONAL COMPUTER · PRESS TO START</div></section>';document.getElementById('begin').onclick=()=>startConnection('signup');document.getElementById('returning').onclick=()=>startConnection('login')}
function startConnection(mode){state.mode=mode;dialupSound();screen.innerHTML='<section class="dial-screen"><div class="dial-window"><div class="dial-title"><span>Dialing Progress</span><div class="dial-controls"><span>_</span><span>×</span></div></div><div class="dial-body"><div class="dial-computer">🖥️</div><div class="dial-modem">📟</div><div class="dial-dots">···</div><div class="dial-globe">🌎</div></div><div class="dial-caption">Connecting to RetroMicro... Please wait<div class="dial-progress"><span></span></div></div></div></section>';setTimeout(()=>account(mode),5600)}
function account(mode='signup'){const login=mode==='login';screen.innerHTML='<section class="opening"><div class="opening-bg"></div><div class="opening-shade"></div><div class="account-old"><div class="old-title">RETROMICRO — '+(login?'Sign In':'Create Your Account')+'</div><div class="old-content"><h2>'+(login?'Welcome back!':'Let’s set up your computer.')+'</h2><p class="muted">'+(login?'Log in to return to your RetroMicro desktop.':'Create your RetroMicro account to get started.')+'</p><div class="old-tabs"><button id="signupTab" class="'+(!login?'active':'')+'">Sign Up</button><button id="loginTab" class="'+(login?'active':'')+'">Log In</button></div><div class="field"><label for="username">Username</label><input id="username" maxlength="24" autocomplete="username" placeholder="Your username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="'+(login?'current-password':'new-password')+'" placeholder="Your password"></div><div class="hint">This is still a visual prototype. Real account creation, secure sign-in, and password recovery are not connected. Do not enter a real password.</div><div class="actions"><button class="btn secondary" id="back">← Back</button><button class="btn" id="continue">'+(login?'Log In':'Create Account')+' →</button></div></div></div></section>';document.getElementById('back').onclick=welcome;document.getElementById('signupTab').onclick=()=>startConnection('signup');document.getElementById('loginTab').onclick=()=>startConnection('login');document.getElementById('continue').onclick=()=>{const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(!u||!p){alert('Please enter a username and demo password to continue.');return}state.username=u;if(login){state.wallpaper='beach';desktop()}else wallpaper()}}
function wallpaper(){const cards=choices.map(c=>'<button class="wall '+(state.wallpaper===c.id?'selected':'')+'" data-choice="'+c.id+'" aria-pressed="'+(state.wallpaper===c.id)+'"><div class="swatch '+c.id+'"></div><strong>'+c.name+'</strong><small>'+c.desc+'</small></button>').join('');screen.innerHTML=topbar('Choose your desktop')+'<section class="panel"><div class="panelbody"><div class="eyebrow">NEW COMPUTER SETUP · 2 OF 2</div><h1 class="hero">Pick your wallpaper.</h1><p class="muted">Choose the full-screen background for your computer. You can change it later.</p><div class="wallpapers">'+cards+'</div><div class="actions"><button class="btn secondary" id="back">← Back</button><button class="btn" id="finish">Set Up My Desktop →</button></div></div></section>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.wallpaper=b.dataset.choice;wallpaper()});document.getElementById('back').onclick=account;document.getElementById('finish').onclick=boot}
function dialupSound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{const ctx=new AC(),master=ctx.createGain();master.gain.value=.045;master.connect(ctx.destination);const tones=[440,620,980,1200,760,1450,520,1100];let t=ctx.currentTime+.08;tones.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=i%2?'sawtooth':'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.55,t+.035);g.gain.setValueAtTime(.55,t+.25);g.gain.linearRampToValueAtTime(.001,t+.38);o.connect(g);g.connect(master);o.start(t);o.stop(t+.4);t+=.37});setTimeout(()=>ctx.close(),5000)}catch(e){}}
function boot(){screen.innerHTML='<section class="boot"><div><div style="font-size:48px">▣</div><h1>RETROMICRO</h1><p>Starting your computer...</p><div class="bootline"><span></span></div><div style="font-size:12px;color:#b9d8ef">Connecting · Loading your desktop · Please wait...</div></div></section>';dialupSound();setTimeout(desktop,7200)}
function desktop(){screen.innerHTML='<div id="desktop"><div class="wallpaper '+state.wallpaper+'"></div><div class="desktop-icons">'+icon('🖥️','My Computer','computer')+icon('🎮','Play Games','games')+icon('👤','My Profile','profile')+icon('🛍️','Shop','shop')+icon('⚙️','Control Panel','settings')+icon('🗑️','Recycle Bin','bin')+'</div><div class="start-menu" id="startMenu"><div class="start-head">RetroMicro · '+safe(state.username)+'</div><div class="start-links"><button data-open="games">🎮 &nbsp; Play Games</button><button data-open="computer">🖥️ &nbsp; My Computer</button><button data-open="profile">👤 &nbsp; My Profile</button><button data-open="shop">🛍️ &nbsp; RetroMicro Shop</button><button data-open="settings">⚙️ &nbsp; Control Panel</button></div></div><div class="taskbar"><button class="start-button" id="start"><span class="start-orb">⊞</span> start</button><button class="task-open" id="taskOpen">RetroMicro Desktop</button><div class="tray"><span id="clock"></span></div></div></div>';document.querySelectorAll('.desktop-icon').forEach(b=>b.ondblclick=()=>openWindow(b.dataset.open));document.querySelectorAll('.desktop-icon').forEach(b=>b.onclick=()=>{document.querySelectorAll('.desktop-icon').forEach(x=>x.style.background='');b.style.background='#4a94d866'});document.getElementById('start').onclick=()=>document.getElementById('startMenu').classList.toggle('show');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{document.getElementById('startMenu').classList.remove('show');openWindow(b.dataset.open)});document.getElementById('taskOpen').onclick=()=>openWindow('computer');tick();setInterval(tick,1000)}
function icon(g,n,id){return '<button class="desktop-icon" data-open="'+id+'"><span class="glyph">'+g+'</span><span>'+n+'</span></button>'}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openWindow(id){const names={computer:'My Computer',games:'Play Games',profile:'My Profile',shop:'RetroMicro Shop',settings:'Control Panel',bin:'Recycle Bin'};const content={computer:'Your RetroMicro computer is ready. Your desktop, games, and personal settings live here.',games:'Your game collection will appear here. This is where your RetroMicro arcade will live!',profile:'Welcome, '+safe(state.username)+'. Your avatar, achievements, and collection will live here.',shop:'Find wallpapers, icons, themes, and other ways to customize your computer.',settings:'Change your wallpaper, desktop appearance, sounds, and computer preferences.',bin:'The Recycle Bin is empty.'};const old=document.getElementById('activeWindow');if(old)old.remove();const w=document.createElement('section');w.className='window';w.id='activeWindow';w.innerHTML='<div class="titlebar" id="dragBar"><span>▣ '+names[id]+'</span><div class="win-controls"><button aria-label="Minimize" id="minWin">_</button><button aria-label="Maximize" id="maxWin">□</button><button aria-label="Close" id="closeWin">×</button></div></div><div class="win-body"><div style="font-size:34px;margin-bottom:8px">'+({computer:'🖥️',games:'🎮',profile:'👤',shop:'🛍️',settings:'⚙️',bin:'🗑️'}[id])+'</div>'+content[id]+'<div class="window-actions"><button id="okWin">OK</button></div></div>';document.getElementById('desktop').appendChild(w);document.getElementById('closeWin').onclick=()=>w.remove();document.getElementById('okWin').onclick=()=>w.remove();document.getElementById('minWin').onclick=()=>w.style.display='none';document.getElementById('maxWin').onclick=()=>{w.style.left='2%';w.style.top='3%';w.style.width='96%';w.style.height='85%'};let drag=false,dx=0,dy=0;const bar=document.getElementById('dragBar');bar.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;drag=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;bar.setPointerCapture(e.pointerId)};bar.onpointermove=e=>{if(drag){w.style.left=Math.max(0,e.clientX-dx)+'px';w.style.top=Math.max(0,e.clientY-dy)+'px'}};bar.onpointerup=()=>drag=false}
function tick(){const el=document.getElementById('clock');if(el)el.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
welcome();
</script></body></html>
