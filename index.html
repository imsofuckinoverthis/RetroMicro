<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174b83">
<title>RetroMicro — Your old-school gaming world</title>
<style>
:root{--blue:#2877b9;--ink:#172b42;--line:#9bb2c8}*{box-sizing:border-box}body{margin:0;background:#101d2c;font-family:Tahoma,Verdana,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}#app{min-height:100svh;display:grid;place-items:center;padding:18px}.monitor{width:min(100%,920px);min-height:610px;background:#d8dfe7;border:5px solid #aab5c1;border-radius:18px;padding:10px;box-shadow:0 24px 70px #0009}.screen{min-height:580px;position:relative;overflow:hidden;border:2px solid #526b82;background:#d9f0ff}.titlebar{background:linear-gradient(#388bd0,#14538f);color:white;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:bold}.panel{width:min(92%,570px);margin:35px auto;background:#f4f5f5;border:1px solid #617f9b;box-shadow:0 8px 28px #183a5a55}.panelbody{padding:22px}.eyebrow{font-size:11px;letter-spacing:1.6px;color:#38688f;font-weight:bold}.hero{font-size:clamp(26px,5vw,42px);margin:8px 0;color:#174b83}.muted{color:#5b6e80;line-height:1.5}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:13px;font-weight:bold}.field input{padding:11px;border:1px solid #8ea6ba;width:100%}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:1px solid #174d7d;background:linear-gradient(#5ca4dc,#2872b3);color:white;padding:10px 17px;border-radius:4px}.secondary{background:linear-gradient(#fff,#dfe7ed);color:#24415d;border-color:#8da4b8}.notice{font-size:12px;background:#fff3d6;border:1px solid #d5b66b;padding:10px;color:#624d1d;line-height:1.4}.wallpapers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wall{border:2px solid transparent;padding:5px;background:white;text-align:left;color:#20384f}.wall.selected{border-color:#1c75b9}.swatch{height:75px;margin-bottom:6px}.w1{background:linear-gradient(#77c5f0 0 55%,#78b76a 56%,#4d9252)}.w2{background:linear-gradient(#ffd77e,#f58f7b 48%,#7754a8 49%,#293b75)}.w3{background:radial-gradient(circle at 70% 30%,white 1px,transparent 2px),linear-gradient(135deg,#101b4b,#493b89,#121c45)}.boot{min-height:580px;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,#2869a4,#071a34);color:white}.boot h1{font-size:clamp(32px,7vw,58px);letter-spacing:2px}.bootline{width:250px;height:8px;border:1px solid #83bde7;margin:20px auto;overflow:hidden}.bootline span{display:block;height:100%;background:#8ee4ff;animation:load 2.4s forwards}@keyframes load{to{width:100%}}.desktop{min-height:580px;padding:18px 18px 55px;position:relative;background:linear-gradient(#82c8ef 0 55%,#83bb70 56%,#4d9854)}.desktop h2{margin:0 0 18px;color:#123b68}.icons{display:grid;grid-template-columns:repeat(3,minmax(75px,100px));gap:15px}.deskicon{border:1px solid transparent;background:#ffffff2c;color:#123b68;font-size:12px;padding:9px 5px;display:grid;justify-items:center;gap:7px;border-radius:4px}.glyph{font-size:30px}.taskbar{position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(#dce9f4,#9bb4c9);border-top:1px solid white;display:flex;align-items:center;padding:5px;gap:8px}.start{font-weight:bold;border-radius:12px 5px 5px 12px;padding:7px 15px;background:linear-gradient(#79c86c,#25833b);color:white;border:1px solid #326b37}.tasklabel{background:#e5edf3;border:1px solid #9aafc1;padding:6px 10px;font-size:12px;flex:1}.window{position:absolute;top:95px;left:50%;transform:translateX(-50%);width:min(88%,420px);background:#f0f2f4;border:1px solid #476b8a;box-shadow:0 10px 35px #122c4d88}.windowcontent{padding:18px;line-height:1.5}.close{border:1px solid white;background:#d85b57;color:white;width:25px;height:24px;border-radius:3px}@media(max-width:560px){#app{padding:0}.monitor{border:0;border-radius:0;padding:0;min-height:100svh}.screen,.desktop,.boot{min-height:100svh}.panel{margin:22px auto}.panelbody{padding:17px}.wall{font-size:11px}.swatch{height:60px}.icons{gap:9px}.deskicon{font-size:11px}}
</style>
</head>
<body><div id="app"><div class="monitor"><main class="screen" id="screen"><section class="boot"><div><div style="font-size:46px">▣</div><h1>RETROMICRO</h1><p>Your old-school gaming world</p><div class="bootline"><span></span></div><small>Starting your computer...</small></div></section></main></div></div>
<script>
var screen=document.getElementById('screen');
var state={username:'PixelPlayer',computer:'My RetroMicro',wallpaper:'blue',sound:true};
var walls=[['blue','Blue Horizon','w1'],['sunset','Pixel Sunset','w2'],['galaxy','Midnight Galaxy','w3']];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function head(s){return '<div class="titlebar"><span>▣ RETROMICRO SETUP</span><small>'+s+'</small></div>'}
function welcome(){screen.innerHTML=head('Welcome')+'<section class="panel"><div class="panelbody"><div class="eyebrow">FIRST-TIME SETUP</div><h1 class="hero">Welcome to your new computer!</h1><p class="muted">Let’s get your RetroMicro ready. This little computer will be yours.</p><div class="notice">This is an early visual prototype. Real account creation, email verification, and passwords are not connected. Please do not enter real passwords or sensitive information.</div><div class="actions"><span></span><button class="btn" id="go">Start setup →</button></div></div></section>';document.getElementById('go').onclick=account}
function account(){screen.innerHTML=head('Step 1 of 2')+'<section class="panel"><div class="panelbody"><div class="eyebrow">YOUR PLAYER</div><h1 class="hero">Who are you?</h1><div class="field"><label>Username</label><input id="user" maxlength="20" value="'+esc(state.username)+'"></div><div class="actions"><button class="btn secondary" id="back">Back</button><button class="btn" id="next">Continue →</button></div></div></section>';document.getElementById('user').oninput=function(e){state.username=e.target.value};document.getElementById('back').onclick=welcome;document.getElementById('next').onclick=function(){if(!state.username.trim()){alert('Choose a username first.');return}personalize()}}
function personalize(){var choices=walls.map(function(w){return '<button class="wall '+(state.wallpaper===w[0]?'selected':'')+'" data-wall="'+w[0]+'"><div class="swatch '+w[2]+'"></div>'+w[1]+'<br><small>FREE</small></button>'}).join('');screen.innerHTML=head('Step 2 of 2')+'<section class="panel"><div class="panelbody"><div class="eyebrow">MAKE IT YOURS</div><h1 class="hero">Set up your computer</h1><div class="field"><label>Computer name</label><input id="computer" maxlength="28" value="'+esc(state.computer)+'"></div><p><b>Choose your free starter wallpaper</b></p><div class="wallpapers">'+choices+'</div><div class="field"><label><input type="checkbox" id="sound" '+(state.sound?'checked':'')+' style="width:auto"> Startup sounds (demo preference)</label></div><div class="actions"><button class="btn secondary" id="back">Back</button><button class="btn" id="finish">Finish setup →</button></div></div></section>';document.getElementById('computer').oninput=function(e){state.computer=e.target.value};document.getElementById('sound').onchange=function(e){state.sound=e.target.checked};document.querySelectorAll('[data-wall]').forEach(function(b){b.onclick=function(){state.wallpaper=b.dataset.wall;personalize()}});document.getElementById('back').onclick=account;document.getElementById('finish').onclick=function(){if(!state.computer.trim()){alert('Name your computer first.');return}localStorage.setItem('retromicro_demo',JSON.stringify(state));desktop()}}
function desktop(){var w=walls.filter(function(x){return x[0]===state.wallpaper})[0]||walls[0];var bg=state.wallpaper==='blue'?'linear-gradient(#82c8ef 0 55%,#83bb70 56%,#4d9854)':state.wallpaper==='sunset'?'linear-gradient(#ffd77e,#f58f7b 52%,#7754a8 53%,#293b75)':'radial-gradient(circle at 70% 30%,white 1px,transparent 2px),linear-gradient(135deg,#101b4b,#493b89,#121c45)';screen.innerHTML='<section class="desktop" style="background:'+bg+'"><h2>'+esc(state.computer)+'</h2><div class="icons"><button class="deskicon" data-win="games"><span class="glyph">🎮</span>Play Games</button><button class="deskicon" data-win="profile"><span class="glyph">👤</span>My Profile</button><button class="deskicon" data-win="shop"><span class="glyph">🛍️</span>Shop</button><button class="deskicon" data-win="settings"><span class="glyph">⚙️</span>Settings</button><button class="deskicon" data-win="appearance"><span class="glyph">🖼️</span>Appearance</button><button class="deskicon" data-win="computer"><span class="glyph">📁</span>My Computer</button></div><div class="taskbar"><button class="start" id="start">START</button><div class="tasklabel">▣ '+esc(state.computer)+'</div><span id="clock"></span></div></section>';document.querySelectorAll('[data-win]').forEach(function(b){b.onclick=function(){openWin(b.dataset.win)}});document.getElementById('start').onclick=function(){openWin('menu')};function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}tick();setInterval(tick,30000)}
var panels={games:['Play Games','Your game library is getting ready. We’ll add original hybrid games one at a time.'],profile:['My Profile','Player: '+''+'<br>Level: 1<br>Coins: 0<br>Character creation is a next milestone.'],shop:['RetroMicro Shop','Computer themes, wallpapers, avatar outfits, accessories, and more.'],settings:['Settings','Account, privacy, sound, accessibility, and parental settings will live here.'],appearance:['Appearance','Current wallpaper: '+ 'Starter wallpaper<br>Three starter wallpapers are free.'],computer:['My Computer','RetroMicro prototype v0.1'],menu:['Start Menu','Play Games · My Profile · Shop · Settings · Shut Down']};
function openWin(id){var p=panels[id]||panels.computer;document.querySelector('.window')?.remove();var win=document.createElement('section');win.className='window';win.innerHTML='<div class="titlebar"><span>'+p[0]+'</span><button class="close" aria-label="Close">×</button></div><div class="windowcontent">'+p[1]+'</div>';screen.querySelector('.desktop').appendChild(win);win.querySelector('.close').onclick=function(){win.remove()}}
setTimeout(welcome,2500);
</script></body></html>
