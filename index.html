<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174b83">
<title>RetroMicro — Your personal Micro Retro desktop</title>
<style>
:root{--blue:#286da5;--ink:#18334c;--silver:#d8dce2;--line:#8da4b8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#33485b,#101923);font-family:Tahoma,Verdana,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}
#app{min-height:100svh;display:grid;place-items:center;padding:22px}
.monitor{width:min(100%,980px);min-height:650px;padding:12px;background:linear-gradient(135deg,#f1f2f3,#9ba5ae 45%,#e4e7e9);border:2px solid #f8f9fa;border-radius:20px;box-shadow:0 25px 80px #000a,inset 0 0 0 2px #7f8a94}
.screen{min-height:624px;position:relative;overflow:hidden;border:3px solid #536778;background:#d8e8f4;box-shadow:inset 0 0 20px #25394c55}
.titlebar{height:34px;background:linear-gradient(#4b9cdb,#1761a0 55%,#14518a);color:white;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold;text-shadow:1px 1px #17436b}
.titlebar small{font-weight:normal}.panel{width:min(90%,610px);margin:48px auto 30px;background:#eceff2;border:1px solid #536d85;box-shadow:0 12px 35px #18334c55}
.panelbody{padding:clamp(20px,4vw,34px)}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#3a6e97;font-weight:bold}.hero{font-size:clamp(27px,5vw,43px);line-height:1.12;margin:10px 0 14px;color:#174b83}.muted{color:#53687b;line-height:1.6}.welcome-mark{font-size:58px;margin:12px 0 4px;color:#2876b4;text-shadow:2px 3px #a8c6dd}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}.btn{border:1px solid #174d7d;background:linear-gradient(#65b1e8,#2872b3 55%,#1b5b96);color:white;padding:11px 22px;border-radius:4px;box-shadow:inset 0 1px #ffffff88,0 2px 2px #0002;text-shadow:0 1px #17436b}.btn:hover{filter:brightness(1.07)}.secondary{background:linear-gradient(#fff,#dce4eb);color:#24415d;border-color:#8da4b8;text-shadow:none}
.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:13px;font-weight:bold}.field input{padding:12px;border:1px solid #8ea6ba;background:#fff;box-shadow:inset 1px 1px 3px #0002;width:100%;border-radius:2px}.hint{font-size:11px;color:#687c8e;line-height:1.5}.notice{font-size:12px;background:#fff3d6;border:1px solid #d5b66b;padding:10px;color:#624d1d;line-height:1.45;margin-top:15px}
.wallpapers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.wall{border:2px solid #a5b5c2;padding:7px;background:#f8fafb;text-align:left;color:#20384f;border-radius:3px}.wall.selected{border:3px solid #1976b9;padding:6px;box-shadow:0 0 0 2px #a8d7f4}.swatch{height:115px;margin-bottom:9px;border:1px solid #8198a9}.wall strong{font-size:13px}.wall small{display:block;color:#52728d;margin-top:4px}
.beach{background:linear-gradient(#69b9e8 0 42%,#f6df9d 43% 54%,#e8c47e 55% 65%,#36a9c7 66% 100%);position:relative}.beach:after{content:"";display:block;width:34px;height:34px;border-radius:50%;background:#ffeaa2;margin:9px 0 0 70%;box-shadow:0 0 18px #ffeaa2}
.guitar{background:linear-gradient(135deg,#2d2632,#9b6241 48%,#211e2a)}.guitar:after{content:"";display:block;width:37px;height:75px;margin:17px auto;background:radial-gradient(ellipse at 50% 60%,#e5ae58 0 28%,transparent 30%),linear-gradient(90deg,transparent 42%,#e8c58a 43% 57%,transparent 58%);border-radius:50%}
.pipes{background-color:#16243a;background-image:linear-gradient(90deg,transparent 48%,#43d6cf 49% 53%,transparent 54%),linear-gradient(0deg,transparent 48%,#f6c84a 49% 53%,transparent 54%),linear-gradient(90deg,transparent 18%,#d45cff 19% 23%,transparent 24%),linear-gradient(0deg,transparent 78%,#76d65e 79% 83%,transparent 84%);background-size:42px 42px,42px 42px,64px 64px,64px 64px}
.boot{min-height:624px;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,#2869a4,#071a34);color:white}.boot h1{font-size:clamp(34px,7vw,62px);letter-spacing:3px;margin:12px 0}.boot p{color:#c8e5fb}.bootline{width:min(310px,70vw);height:13px;border:1px solid #8fc9ee;margin:25px auto 12px;padding:2px;background:#0b2541}.bootline span{display:block;height:100%;width:0;background:linear-gradient(90deg,#65c4ee,#d5f6ff);animation:load 7s linear forwards}@keyframes load{to{width:100%}}.bootnote{font-size:12px;color:#b9d8ef}
@media(max-width:600px){#app{padding:0}.monitor{border:0;border-radius:0;padding:0;min-height:100svh}.screen,.boot{min-height:100svh}.panel{margin:28px auto}.wallpapers{gap:7px}.swatch{height:82px}.wall{padding:5px}.wall.selected{padding:4px}.wall strong{font-size:11px}.actions{margin-top:20px}}
</style>
</head>
<body>
<div id="app"><div class="monitor"><main class="screen" id="screen" aria-live="polite"></main></div></div>
<script>
const screen=document.getElementById('screen');
const state={username:'',password:'',wallpaper:'beach'};
const choices=[
 {id:'beach',name:'Sunny Beach',desc:'A little seaside escape',css:'beach'},
 {id:'guitar',name:'Electric Guitar',desc:'Turn up the volume',css:'guitar'},
 {id:'pipes',name:'Color Pipes',desc:'Classic computer colors',css:'pipes'}
];
function topbar(step){return '<div class="titlebar"><span>▣ RETROMICRO</span><small>'+step+'</small></div>'}
function welcome(){
 screen.innerHTML=topbar('Welcome')+'<section class="panel"><div class="panelbody"><div class="eyebrow">YOUR COMPUTER. YOUR WORLD.</div><div class="welcome-mark">▣</div><h1 class="hero">This is your own RetroMicro desktop.</h1><h2 style="font-size:clamp(17px,3vw,22px);font-weight:normal;color:#376b91;margin:0 0 12px">Your personal Micro Retro desktop.</h2><p class="muted">A little piece of the old-school computer days, made just for you. Set up your desktop, make it yours, and explore your own gaming world.</p><div class="actions"><span class="hint">Welcome to RetroMicro!</span><button class="btn" id="begin">Get Started&nbsp; →</button></div></div></section>';
 document.getElementById('begin').onclick=account;
}
function account(){
 screen.innerHTML=topbar('Create your account')+'<section class="panel"><div class="panelbody"><div class="eyebrow">NEW COMPUTER SETUP · 1 OF 2</div><h1 class="hero">Let's get you signed in.</h1><p class="muted">Choose a username and a password for your RetroMicro account.</p><div class="field"><label for="username">Username</label><input id="username" maxlength="24" autocomplete="username" placeholder="What should we call you?"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="Create a password"></div><div class="hint">This is a visual prototype. Account creation and secure password storage are not connected yet. Please use a made-up demo password, not a real password.</div><div class="actions"><button class="btn secondary" id="back">← Back</button><button class="btn" id="setup">Set Up&nbsp; →</button></div></div></section>';
 document.getElementById('back').onclick=welcome;
 document.getElementById('setup').onclick=()=>{const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value;if(!u||!p){alert('Please enter a username and a demo password to continue.');return}state.username=u;state.password='';wallpaper()};
}
function wallpaper(){
 const cards=choices.map(c=>'<button class="wall '+(state.wallpaper===c.id?'selected':'')+'" data-choice="'+c.id+'" aria-pressed="'+(state.wallpaper===c.id)+'"><div class="swatch '+c.css+'"></div><strong>'+c.name+'</strong><small>'+c.desc+'</small></button>').join('');
 screen.innerHTML=topbar('Choose your desktop')+'<section class="panel"><div class="panelbody"><div class="eyebrow">NEW COMPUTER SETUP · 2 OF 2</div><h1 class="hero">Pick your wallpaper.</h1><p class="muted">Every computer needs a look. Choose one of these three free wallpapers to start with. You can change it later.</p><div class="wallpapers">'+cards+'</div><div class="actions"><button class="btn secondary" id="back">← Back</button><button class="btn" id="finish">Set Up My Desktop&nbsp; →</button></div></div></section>';
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.wallpaper=b.dataset.choice;wallpaper()});
 document.getElementById('back').onclick=account;
 document.getElementById('finish').onclick=boot;
}
function dialupSound(){
 const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;
 try{
  const ctx=new AudioContext();const master=ctx.createGain();master.gain.value=.055;master.connect(ctx.destination);
  const tones=[{f:440,d:.35},{f:620,d:.3},{f:980,d:.45},{f:1200,d:.5},{f:760,d:.4},{f:1450,d:.55},{f:520,d:.35},{f:1100,d:.65}];let t=ctx.currentTime+.08;
  tones.forEach((tone,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=i%2?'sawtooth':'sine';osc.frequency.setValueAtTime(tone.f,t);gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(.65,t+.035);gain.gain.setValueAtTime(.65,t+tone.d-.04);gain.gain.linearRampToValueAtTime(.001,t+tone.d);osc.connect(gain);gain.connect(master);osc.start(t);osc.stop(t+tone.d);t+=tone.d*.92});
  const noiseLength=Math.floor(ctx.sampleRate*1.8),buffer=ctx.createBuffer(1,noiseLength,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<noiseLength;i++)data[i]=(Math.random()*2-1)*.16;
  const noise=ctx.createBufferSource(),ng=ctx.createGain();noise.buffer=buffer;ng.gain.setValueAtTime(.001,t);ng.gain.linearRampToValueAtTime(.2,t+.15);ng.gain.linearRampToValueAtTime(.001,t+1.8);noise.connect(ng);ng.connect(master);noise.start(t);noise.stop(t+1.8);
  setTimeout(()=>ctx.close(),7000);
 }catch(e){/* Sound is optional; continue booting if unavailable. */}
}
function boot(){
 screen.innerHTML='<section class="boot"><div><div style="font-size:48px">▣</div><h1>RETROMICRO</h1><p>Connecting to your own little world...</p><div class="bootline"><span></span></div><div class="bootnote">Dialing in · Loading your desktop · Please wait...</div></div></section>';
 dialupSound();
 setTimeout(()=>{screen.innerHTML=topbar('Ready')+'<section class="panel"><div class="panelbody"><div class="eyebrow">SETUP COMPLETE</div><h1 class="hero">Your desktop is ready, '+escapeHtml(state.username)+'!</h1><p class="muted">Your RetroMicro computer has finished starting up. The full interactive desktop is the next piece we'll build.</p><div class="actions"><span></span><button class="btn" id="enter">Enter My Desktop →</button></div></div></section>';document.getElementById('enter').onclick=desktop},7200);
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function desktop(){
 const c=choices.find(x=>x.id===state.wallpaper)||choices[0];
 const bg=state.wallpaper==='beach'?'linear-gradient(#69b9e8 0 42%,#f6df9d 43% 54%,#e8c47e 55% 65%,#36a9c7 66% 100%)':state.wallpaper==='guitar'?'linear-gradient(135deg,#2d2632,#9b6241 48%,#211e2a)':'#16243a';
 screen.innerHTML='<section style="min-height:624px;padding:24px;background:'+bg+';position:relative"><h2 style="color:#123b68">'+escapeHtml(state.username)+"'s RetroMicro</h2><p style='color:#173c5b'>Your personal Micro Retro desktop</p><div style='position:absolute;bottom:0;left:0;right:0;background:linear-gradient(#dce9f4,#9bb4c9);padding:12px;font-size:13px'>▣ START &nbsp;&nbsp; RetroMicro &nbsp;&nbsp; "+c.name+"</div></section>";
}
welcome();
</script>
</body>
</html>
